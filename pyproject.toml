[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["plugins/local-tools/src/local_tools_mcp", "scripts"]
patch = ["subprocess"]
parallel = true
sigterm = true

[tool.coverage.report]
show_missing = true
